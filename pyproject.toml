[project]
name = "mtp-cli"
version = "0.1.0"
description = "Command-line client for the MDI MTP tracker on writable.site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtp = "mtp_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtp_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
